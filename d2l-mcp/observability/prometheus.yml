global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "horizon-gateway"
    static_configs:
      - targets: ["gateway:8080"]
    metrics_path: /metrics
    # The gateway only serves /metrics to "Authorization: Bearer $METRICS_TOKEN".
    # Mount a file containing that token (no trailing newline needed) here.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
